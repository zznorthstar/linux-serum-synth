[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zygzxg-research-tools"
version = "0.1.0"
description = "Interoperability research and local asset indexing for ZYG-ZXG"
requires-python = ">=3.11"
dependencies = ["cbor2>=5.6", "zstandard>=0.22"]

[project.optional-dependencies]
oracle = ["numpy>=2", "soundfile>=0.13"]

[project.scripts]
zygzxg = "zygzxg.cli:main"

[tool.setuptools.packages.find]
include = ["zygzxg*"]
